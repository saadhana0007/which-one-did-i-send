<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which One Did I Send?</title>
<style>
  :root {
    --cream: #fbf6ea; --card: #fffdf7; --ink: #2a1f3d; --muted: #7a6f8c;
    --purple: #5b2a86; --purple-2: #7c4dba; --lilac: #ece2f8; --line: #e3d9c8;
    --red: #b3261e; --red-bg: #fde8e6; --green: #2e7d4f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--purple); color: #fff; padding: 22px 16px 26px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -.3px; }
  header p { margin: 2px 0 0; opacity: .8; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
  .ask { margin-top: -18px; display: flex; gap: 8px; }
  .ask input { flex: 1; padding: 14px 16px; font-size: 16px; border: 2px solid var(--purple-2);
               border-radius: 12px; background: #fff; outline: none; box-shadow: 0 4px 14px rgba(91,42,134,.18); }
  button { background: var(--purple); color: #fff; border: 0; padding: 0 20px; border-radius: 12px;
           font-size: 15px; font-weight: 600; cursor: pointer; min-height: 44px; }
  button:hover { background: var(--purple-2); }
  button.ghost { background: var(--lilac); color: var(--purple); }
  .answer { margin-top: 12px; padding: 16px 18px; background: var(--card); border: 1px solid var(--line);
            border-left: 5px solid var(--purple); border-radius: 12px; display: none; }
  .answer .main { font-size: 17px; font-weight: 600; }
  .answer .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .answer .newer { margin-top: 10px; padding: 10px 12px; background: var(--red-bg); color: var(--red);
                   border-radius: 8px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .answer .newer button { background: var(--red); min-height: 32px; padding: 0 14px; }
  .answer .ok { margin-top: 10px; color: var(--green); font-weight: 600; }
  .alerts { margin-top: 16px; display: grid; gap: 8px; }
  .alert { background: var(--red-bg); border: 1px solid #f0b9b4; color: var(--red); padding: 9px 12px;
           border-radius: 10px; font-size: 14px; cursor: pointer; }
  .alert b { margin-right: 6px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; margin-top: 22px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .fam { padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
         background: #fff; cursor: pointer; }
  .fam:hover { border-color: var(--purple-2); }
  .fam.sel { border-color: var(--purple); background: var(--lilac); }
  .fam .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .fam .s { color: var(--muted); font-size: 13px; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--lilac);
          color: var(--purple); white-space: nowrap; }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .timeline { position: relative; margin-left: 10px; padding-left: 26px; border-left: 3px solid var(--lilac); }
  .ev { position: relative; margin-bottom: 14px; }
  .ev .dot { position: absolute; left: -36px; top: 4px; width: 17px; height: 17px; border-radius: 50%;
             background: var(--purple); border: 3px solid var(--cream); }
  .ev.latest .dot { box-shadow: 0 0 0 3px var(--purple-2); }
  .ev.share .dot { background: #fff; border: 3px solid var(--purple-2); width: 13px; height: 13px; left: -34px; }
  .ev .when { color: var(--muted); font-size: 12px; }
  .ev .name { font-weight: 600; }
  code { background: var(--lilac); color: var(--purple); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .sharebox { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; margin-right: 6px; }
  .b-gmail { background: #d93025; } .b-whatsapp { background: #1fa855; } .b-drive { background: #f0a30a; color: #2a1f3d; }
  .b-lms { background: #1d6fd1; } .b-other { background: #6b6480; }
  form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  form .full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 3px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
                  font: inherit; background: #fff; }
  form button { min-height: 42px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--muted); font-size: 12px; }
  .wa { margin-top: 14px; padding: 12px 14px; background: #e9f7ef; border: 1px solid #b7e1c6; border-radius: 10px; }
  .wa a { color: var(--purple); font-weight: 600; }
  button:disabled { opacity: .5; cursor: wait; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
           padding: 10px 18px; border-radius: 10px; display: none; z-index: 9; }
</style>
</head>
<body>
<header>
  <h1>Which One Did I Send?</h1>
  <p>Files identified by content, not filename. Local-first.</p>
</header>
<main>
  <div class="ask">
    <input id="q" placeholder="What did I send to my professor?" autocomplete="off">
    <button id="askBtn">Ask</button>
  </div>
  <div id="answer" class="answer"></div>
  <div id="alerts" class="alerts"></div>

  <div class="grid">
    <section>
      <h2>Document families</h2>
      <div id="families"></div>
    </section>
    <section>
      <h2>Timeline</h2>
      <div class="card" id="timeline"><div class="empty">Select a family to see its versions and sends.</div></div>
    </section>
  </div>

  <section style="margin-top:22px" id="logSend">
    <h2>Send or log a file</h2>
    <div class="card">
      <form id="shareForm">
        <div><label>Pick a file (identified by its content)</label><input type="file" id="f_file"></div>
        <div><label>...or a tracked file from the watched folder</label>
          <select id="f_tracked"><option value="">(none)</option></select></div>
        <div><label>Platform</label>
          <select id="f_platform"><option>Gmail</option><option>WhatsApp</option><option>Drive</option><option>LMS</option><option>Other</option></select></div>
        <div><label id="recLabel">Recipient</label><input id="f_recipient" placeholder="prof.kumar@ssn.edu.in" required></div>
        <div class="full" id="msgRow"><label>Message (email body / WhatsApp text)</label><input id="f_message" placeholder="Hi, please find the file attached."></div>
        <div class="full"><label>Note (kept in your timeline)</label><input id="f_note" placeholder="e.g. final submission"></div>
        <div class="full actions">
          <button type="button" id="sendBtn">Send via Gmail</button>
          <button type="button" id="waDriveBtn" style="display:none">Upload to Drive &amp; open WhatsApp</button>
          <button type="button" id="waBtn" class="ghost" style="display:none">Open WhatsApp (text only)</button>
          <button type="submit" class="ghost">Log only (already sent)</button>
          <span class="hint" id="hint"></span>
        </div>
      </form>
      <div id="confirmBox" class="wa" style="display:none;background:#fff6e0;border-color:#f0d28a"></div>
      <div id="status" class="wa" style="display:none"></div>
      <div id="waPanel" class="wa" style="display:none"></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => { const d = new Date(iso); if (isNaN(d)) return iso;
  return `${d.getDate()} ${d.toLocaleString("en", {month:"short"})}, ${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,"0")} ${d.getHours()<12?"AM":"PM"}`; };
const badge = p => `<span class="badge b-${esc(p).toLowerCase().replace(/[^a-z]/g,"") in {gmail:1,whatsapp:1,drive:1,lms:1} ? esc(p).toLowerCase() : "other"}">${esc(p)}</span>`;
const api = async (url, opt) => { const r = await fetch(url, opt); if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText); return r.json(); };
function status(msg, ok = true) {
  const el = $("status"); el.style.display = "block";
  el.style.background = ok ? "#e9f7ef" : "#fde8e6"; el.style.borderColor = ok ? "#b7e1c6" : "#f0b9b4";
  el.style.color = ok ? "#1d5a38" : "#b3261e"; el.textContent = msg;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2600); }

let selected = null, sig = {fam: "", alerts: "", tl: ""};

async function loadFamilies() {
  const [fams, alerts] = await Promise.all([api("/api/families"), api("/api/alerts")]);
  const fs = JSON.stringify(fams), as = JSON.stringify(alerts);
  if (fs !== sig.fam) { sig.fam = fs; renderFamilies(fams); loadTracked().catch(() => {}); }
  if (as !== sig.alerts) { sig.alerts = as; renderAlerts(alerts); }
  if (selected) loadTimeline(selected).catch(() => { selected = null; sig.tl = ""; });
}

function renderFamilies(fams) {
  $("families").innerHTML = fams.length ? fams.map(f => `
    <div class="fam ${f.id === selected ? "sel" : ""}" data-id="${f.id}">
      <div class="t"><span>${esc(f.display_name)}</span>
        ${f.outdated ? '<span class="pill red">outdated send</span>' : ""}</div>
      <div class="s">${f.version_count} version${f.version_count > 1 ? "s" : ""} · latest <code>${esc(f.latest_version.short)}</code> ${esc(f.latest_version.filename)}</div>
      <div class="s">${f.last_share ? `Last sent to ${esc(f.last_share.recipient)} via ${esc(f.last_share.platform)}, ${fmt(f.last_share.sent_at)}` : "Never sent"}</div>
    </div>`).join("") : '<div class="empty">No files yet. Drop files into the watched folder.</div>';
  document.querySelectorAll(".fam").forEach(el => el.onclick = () => selectFamily(+el.dataset.id));
}

function renderAlerts(alerts) {
  $("alerts").innerHTML = alerts.map(a => `<div class="alert" data-id="${a.family_id}"><b>Outdated send</b>${esc(a.text)}</div>`).join("");
  document.querySelectorAll(".alert").forEach(el => el.onclick = () => selectFamily(+el.dataset.id));
}

function selectFamily(id) {
  selected = id; sig.tl = ""; sig.fam = "";
  loadFamilies();
}

async function loadTimeline(id) {
  const t = await api(`/api/families/${id}/timeline`);
  const s = JSON.stringify(t);
  if (s === sig.tl) return;
  sig.tl = s;
  $("timeline").innerHTML = `<div style="font-weight:700;margin-bottom:14px">${esc(t.family.display_name)}</div>
    <div class="timeline">${t.events.map(e => e.type === "version" ? `
      <div class="ev ${e.is_latest ? "latest" : ""}"><span class="dot"></span>
        <div class="when">${fmt(e.at)} · version created</div>
        <div class="name">${esc(e.filename)} <code>${esc(e.short)}</code> ${e.is_latest ? '<span class="pill">LATEST</span>' : ""}</div></div>` : `
      <div class="ev share"><span class="dot"></span>
        <div class="when">${fmt(e.at)}</div>
        <div class="sharebox">${badge(e.platform)} sent to <b>${esc(e.recipient)}</b>
          <div class="when">${esc(e.filename)} <code>${esc(e.short)}</code>${e.outdated ? ' <span class="pill red">outdated</span>' : ""}${e.note ? " · " + esc(e.note) : ""}</div></div></div>`).join("")}
    </div>`;
}

async function ask() {
  const q = $("q").value.trim(); if (!q) return;
  const a = $("answer"); a.style.display = "block";
  try {
    const d = await api("/api/ask?q=" + encodeURIComponent(q));
    if (!d.found) { a.innerHTML = `<div class="main">${esc(d.message)}</div>`; return; }
    a.innerHTML = `<div class="main">${esc(d.message)}</div>
      <div class="sub">Identified by content <code>${esc(d.version.short)}</code>${d.currently_named ? ` · file is now named <b>${esc(d.currently_named)}</b>` : ""}</div>
      ${d.newer ? `<div class="newer"><span>${esc(d.newer.text)} Resend?</span><button id="resend">Resend newer version</button></div>`
                 : '<div class="ok">✓ This is the latest version.</div>'}`;
    if (d.newer) $("resend").onclick = async () => {
      await loadTracked().catch(() => {});
      $("f_recipient").value = d.share.recipient;
      $("f_platform").value = [...$("f_platform").options].some(o => o.value === d.share.platform) ? d.share.platform : "Other";
      $("f_tracked").value = d.newer.sha256;  // empty if that file is not on disk
      $("f_note").value = "Resend of newer version"; syncPlatform();
      $("logSend").scrollIntoView({behavior: "smooth"}); };
    selectFamily(d.family.id);
  } catch (e) { a.innerHTML = `<div class="main">${esc(e.message)}</div>`; }
}
$("askBtn").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });


// ---- send / log form ----
const DEFAULT_CC = "91";  // India; change if your contacts are elsewhere
function source() {
  const file = $("f_file").files[0], sha = $("f_tracked").value;
  if (!file && !sha) { toast("Pick a file or a tracked file first"); return null; }
  return {file, sha};
}
function body(src, extra = {}) {
  const fd = new FormData();
  if (src.file) {
    fd.append("file", src.file);
    const m = new Date(src.file.lastModified), p = n => String(n).padStart(2, "0");
    fd.append("modified_at", `${m.getFullYear()}-${p(m.getMonth()+1)}-${p(m.getDate())}T${p(m.getHours())}:${p(m.getMinutes())}:${p(m.getSeconds())}`);
  } else fd.append("sha256", src.sha);
  fd.append("platform", $("f_platform").value);
  fd.append("recipient", $("f_recipient").value.trim());
  fd.append("note", $("f_note").value);
  fd.append("message", $("f_message").value);
  for (const [k, v] of Object.entries(extra)) fd.set(k, v);
  return fd;
}
function afterSave(r, msg) {
  toast(r.outdated ? msg + " Note: a newer version exists!" : msg);
  selected = r.family_id; sig = {fam: "", alerts: "", tl: ""};
  $("shareForm").reset(); $("waPanel").style.display = "none"; $("confirmBox").style.display = "none"; syncPlatform();
  loadFamilies();
}
const fname = src => src.file ? src.file.name : ($("f_tracked").selectedOptions[0]?.textContent.split(" · ")[0] || "the file");

function syncPlatform() {
  const p = $("f_platform").value;
  $("sendBtn").style.display = p === "Gmail" ? "" : "none";
  $("waBtn").style.display = $("waDriveBtn").style.display = p === "WhatsApp" ? "" : "none";
  $("recLabel").textContent = p === "WhatsApp" ? "Phone number (10-digit Indian numbers get +91 automatically)" : "Recipient";
  $("f_recipient").placeholder = p === "WhatsApp" ? "919876543210" : "prof.kumar@ssn.edu.in";
  $("hint").textContent = p === "Gmail" ? "Sends a real email with the file attached."
    : p === "WhatsApp" ? "Uploads the file to your Drive and puts a view link in the WhatsApp message."
    : "No integration for this platform; use Log only.";
}
$("f_platform").onchange = syncPlatform; syncPlatform();

$("sendBtn").onclick = () => {
  const src = source(); if (!src) { status("Pick a file or a tracked file first.", false); return; }
  const to = $("f_recipient").value.trim();
  if (!to) { status("Enter a recipient email address first.", false); return; }
  $("status").style.display = "none";
  const box = $("confirmBox"); box.style.display = "block";
  box.innerHTML = `<b>Send a REAL email?</b> To <b>${esc(to)}</b> with <b>${esc(fname(src))}</b> attached.
    <div style="margin-top:10px;display:flex;gap:10px"><button type="button" id="yesSend">Yes, send it</button>
    <button type="button" class="ghost" id="noSend">Cancel</button></div>`;
  $("noSend").onclick = () => box.style.display = "none";
  $("yesSend").onclick = async () => {
    $("yesSend").disabled = true; status("Sending...");
    try {
      const r = await api("/api/send/gmail", {method: "POST", body: body(src, {confirm: "yes", subject: ""})});
      box.style.display = "none";
      afterSave(r, "Email sent and logged.");
      status(`Email sent to ${to} and logged (Gmail message id ${r.gmail_message_id}).`);
    } catch (err) { box.style.display = "none"; status("Not sent: " + err.message, false); }
  };
};

function waDigits() {
  let d = $("f_recipient").value.replace(/\D/g, "").replace(/^0+/, "");
  if (d.length === 10) d = DEFAULT_CC + d;  // bare national number -> add default country code
  return d;
}

// Shows the chat links + the log button. `link` (optional) is the Drive link already in the message text.
function showWa(src, digits, text, link) {
  const t = encodeURIComponent(text);
  const web = `https://web.whatsapp.com/send?phone=${digits}&text=${t}`;
  const wame = `https://wa.me/${digits}?text=${t}`;
  const step2 = link ? `The message already contains the file link <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a>. Just press send in WhatsApp.`
    : (src.sha ? `<a href="/api/files/${esc(src.sha)}" download>Download ${esc(fname(src))}</a>, attach it, then press send.` : `Attach <b>${esc(fname(src))}</b>, then press send.`);
  $("waPanel").style.display = "block";
  $("waPanel").innerHTML = `<b>Step 1:</b> open the chat (use your normal browser): <a href="${web}" target="_blank" rel="noopener">WhatsApp Web</a> ·
    <a href="${wame}" target="_blank" rel="noopener">wa.me link</a> ·
    <a href="whatsapp://send?phone=${digits}&text=${t}">WhatsApp desktop app</a><br>
    <b>Step 2:</b> ${step2}<br>
    <b>Step 3:</b> <div style="margin-top:8px"><button type="button" id="waDone">I sent it - log it</button></div>`;
  $("waDone").onclick = async () => {
    const extra = link ? {note: ($("f_note").value ? $("f_note").value + " | " : "") + "Drive link: " + link} : {};
    try { afterSave(await api("/api/shares", {method: "POST", body: body(src, extra)}), "WhatsApp send logged."); status("WhatsApp send logged."); }
    catch (err) { status("Could not log: " + err.message, false); }
  };
}

$("waBtn").onclick = () => {
  const src = source(); if (!src) { status("Pick a file or a tracked file first.", false); return; }
  const digits = waDigits();
  if (digits.length < 8) { status("Enter the phone number (10 digits, or with country code).", false); return; }
  $("status").style.display = "none";
  showWa(src, digits, $("f_message").value.trim() || `Sending you ${fname(src)}`, null);
};

$("waDriveBtn").onclick = () => {
  const src = source(); if (!src) { status("Pick a file or a tracked file first.", false); return; }
  const digits = waDigits();
  if (digits.length < 8) { status("Enter the phone number (10 digits, or with country code).", false); return; }
  $("status").style.display = "none";
  const box = $("confirmBox"); box.style.display = "block";
  box.innerHTML = `<b>Upload to your Google Drive?</b> <b>${esc(fname(src))}</b> will be uploaded and made
    <b>viewable by anyone who has the link</b>. Only share the link with people you trust; you can remove the sharing later in Drive.
    <div style="margin-top:10px;display:flex;gap:10px"><button type="button" id="yesDrive">Yes, upload and create link</button>
    <button type="button" class="ghost" id="noDrive">Cancel</button></div>`;
  $("noDrive").onclick = () => box.style.display = "none";
  $("yesDrive").onclick = async () => {
    $("yesDrive").disabled = true; status("Uploading to Drive...");
    try {
      const fd = new FormData(); fd.append("confirm", "yes");
      if (src.file) { fd.append("file", src.file); } else fd.append("sha256", src.sha);
      const r = await api("/api/send/drive-link", {method: "POST", body: fd});
      box.style.display = "none"; $("status").style.display = "none";
      const msg = $("f_message").value.trim();
      showWa(src, digits, `${msg || "Sending you " + fname(src)}\n${r.link}`, r.link);
    } catch (err) { box.style.display = "none"; status("Upload failed: " + err.message, false); }
  };
};

$("shareForm").onsubmit = async e => {
  e.preventDefault();
  const src = source(); if (!src) return;
  try { afterSave(await api("/api/shares", {method: "POST", body: body(src)}), "Send logged."); }
  catch (err) { toast("Error: " + err.message); }
};

async function loadTracked() {
  const cur = $("f_tracked").value;
  const vs = await api("/api/versions");
  $("f_tracked").innerHTML = '<option value="">(none)</option>' +
    vs.map(v => `<option value="${esc(v.sha256)}">${esc(v.filename)} · ${esc(v.short)}</option>`).join("");
  $("f_tracked").value = cur;
}

loadFamilies();
setInterval(() => loadFamilies().catch(() => {}), 3000);
</script>
</body>
</html>
